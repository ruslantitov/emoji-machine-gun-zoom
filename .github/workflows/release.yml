name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/emoji-machine-gun-zoom-${{ github.ref_name }}.zip" \
            "Emoji machine gun (Zoom).ahk" \
            "README.md" \
            "QUICK_START.md" \
            "LICENSE" \
            "START.cmd" \
            "bootstrap.ps1" \
            "watch-zoom.ps1" \
            "uninstall.cmd" \
            "uninstall.ps1" \
            "macos/Emoji machine gun (Zoom).app" \
            "macos/bootstrap.sh" \
            "macos/init.lua" \
            "macos/README.md" \
            "macos/uninstall.sh"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emoji-machine-gun-zoom-${{ github.ref_name }}.zip
          body: |
            Download the ZIP asset, extract it, and run `START.cmd` on Windows or double-click `macos/Emoji machine gun (Zoom).app` on macOS.
            The installers will check prerequisites, install what is needed, guide the user through permissions, and start/stop the automation automatically around Zoom.
          generate_release_notes: true
