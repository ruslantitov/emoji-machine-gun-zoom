name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/emoji-machine-gun-zoom-${{ github.ref_name }}.zip"
          $files = @(
            "Emoji machine gun (Zoom).ahk",
            "README.md",
            "QUICK_START.md",
            "LICENSE",
            "START.cmd",
            "bootstrap.ps1",
            "uninstall.cmd",
            "uninstall.ps1"
          )
          Compress-Archive -Path $files -DestinationPath $zip -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emoji-machine-gun-zoom-${{ github.ref_name }}.zip
          body: |
            Download the ZIP asset, extract it, and run `START.cmd`.
            The installer will check `winget`, install AutoHotkey v2 if needed, and enable startup.
          generate_release_notes: true
